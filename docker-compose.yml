services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: parking_db
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./parkingApi
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=parking_db
    restart: always
    depends_on:
      - db

  frontend:
    build:
      context: ./parkingWeb
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend

volumes:
  mysql_data:

